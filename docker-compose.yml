services:
  homepage:
    build: .
    container_name: homepage
    ports:
      - 127.0.0.1:8099:3000
    volumes:
      - ./config:/app/config
      - ./config/icons:/app/public/icons
    environment:
      - PUID=1000
      - PGID=1000
      - HOMEPAGE_ALLOWED_HOSTS=localhost:8099,homepage.thecreems.com
      - HOMEPAGE_VAR_BALANCE_PROXY_URL=${BALANCE_PROXY_URL}
      # Varlock configuration
      - VARLOCK_ENABLED=true
      - VARLOCK_INFISICAL_PROJECT_ID=${VARLOCK_INFISICAL_PROJECT_ID}
      - VARLOCK_INFISICAL_ENV=${VARLOCK_INFISICAL_ENV:-production}
    restart: unless-stopped

  balance-proxy:
    build: ./proxy
    container_name: balance-proxy
    ports:
      - 127.0.0.1:3005:3005
    environment:
      # Varlock configuration
      - VARLOCK_ENABLED=true
      - VARLOCK_INFISICAL_PROJECT_ID=${VARLOCK_INFISICAL_PROJECT_ID}
      - VARLOCK_INFISICAL_ENV=${VARLOCK_INFISICAL_ENV:-production}
      # Secrets will be injected by Varlock
    restart: unless-stopped

services:
  homepage:
    build: .
    container_name: homepage
    ports:
      - 127.0.0.1:8099:3000
    volumes:
      - ./config:/app/config
      - ./config/icons:/app/public/icons
    environment:
      - PUID=1000
      - PGID=1000
      - HOMEPAGE_ALLOWED_HOSTS=localhost:8099,homepage.thecreems.com
      - HOMEPAGE_VAR_BALANCE_PROXY_URL=${BALANCE_PROXY_URL}
      # Infisical credentials (for Varlock)
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV:-production}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
    restart: unless-stopped

  balance-proxy:
    build: ./proxy
    container_name: balance-proxy
    ports:
      - 127.0.0.1:3005:3005
    environment:
      # Infisical credentials (for Varlock)
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENV=${INFISICAL_ENV:-production}
      - INFISICAL_CLIENT_ID=${INFISICAL_CLIENT_ID}
      - INFISICAL_CLIENT_SECRET=${INFISICAL_CLIENT_SECRET}
    restart: unless-stopped
